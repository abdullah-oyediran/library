<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <!--the header and navigation bars-->
        <div id="header">
            <div class="nav-bar">
                <img alt="Dark mode" src="assets/moon.svg">
            </div>
            <h2 id="logo">
                My library
            </h2>
            <div class="nav-bar">
                <img alt="Add new book" src="assets/plus.svg">
            </div>
        </div>

        <!--the book library-->
        <div id="book-library">
            <!--
            <div class="book">
                <h3 class="book-card">
                    Super Gene
                </h3>

                <p class="author">Author's name</p>

                <div class="footer">
                    <img alt="Delete book" src="assets/trash.svg">
                    <p class="no-pages">255 pages</p>
                    <img alt="Read" src="assets/book-open-check.svg">
                </div>
            </div> -->
            
        </div>

        <div id="form-container">
            <form>
                <label for="title">Title</label>
                <input id="title" required type="text" placeholder="Enter the title">
                <label for="author">Author's name</label>
                <input id="author" required type="text" placeholder="Enter the author's name">
                <label for="pages">Number of pages</label>
                <input id="pages" type="number" required placeholder="No of pages">
                <button type="submit" id="submit-btn">Add New Book</button>
            </form>
        </div>

    </div>
    <script src="js/script.js"></script>
</body>
</html>
