<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <!--the header and navigation bars-->
        <div id="header">
            <div class="nav-bar">
                <button>
                    <img alt="Dark mode" src="assets/moon.svg">
                </button>
            </div>
            <h2 id="logo">
                My Books
            </h2>
            <div class="nav-bar">
                <button id="show-form" title="Add new book">
                    <img alt="Add new book" src="assets/plus.svg">
                </button>
            </div>
        </div>

        <!--the book library-->
        <div id="book-library">

        </div>
        
        <div id="empty-lib-markup">
            <img alt="No books" src="assets/x.svg">
            <p>Click the '+' icon to add a book.</p>
        </div>

        <div id="form-container">
            <form>
                <label for="title">Title</label>
                <input id="title" required type="text" placeholder="Enter the title">
                <label for="author">Author's name</label>
                <input id="author" required type="text" placeholder="Enter the author's name">
                <label for="pages">Number of pages</label>
                <input id="pages" type="number" required placeholder="No of pages" min="5">
                <button type="submit" id="submit-btn">Add New Book</button>

                <button type="button" id="hide-form" title="Return to book library">
                    <img alt="Hide Form" src="assets/x.svg">
                </button>
            </form>
        </div>

    </div>
    <script src="js/script.js"></script>
</body>
</html>
